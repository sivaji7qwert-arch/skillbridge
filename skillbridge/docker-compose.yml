version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: skillbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: skillbridge-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=skillbridge
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/skillbridge
      - CORS_ORIGINS=http://localhost:5173
      - DATA_DIR=/app/data/processed
      - RAW_DATA_DIR=/app/data/raw
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: skillbridge-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
